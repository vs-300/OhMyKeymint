name: Build OhMyKeymint

on:
  push:
    branches: [ "stable-build" ]
  workflow_dispatch:

jobs:
  build-boringssl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Clone BoringSSL
      run: |
        git clone https://boringssl.googlesource.com/boringssl
        cd boringssl
        git checkout $(git rev-list -n 1 --before="2024-06-01" origin/master)

    - name: Cache BoringSSL build
      uses: actions/cache@v4
      id: boringssl-cache
      with:
        path: boringssl/build
        key: boringssl-v2-${{ hashFiles('boringssl/.git/HEAD') }}

    - name: Install Rust toolchain
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android

    - name: Install Android SDK
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@v3
      
    - name: Install Android NDK and bindgen
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        cargo install bindgen-cli
        echo "y" | sdkmanager --install "ndk;29.0.14206865" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "ndk-bundle" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "cmake;4.1.2" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null

    - name: Install build dependencies
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-multilib

    - name: Build BoringSSL
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        cd boringssl
        export PATH="~/.cargo/bin:$PATH"
        $ANDROID_SDK_ROOT/cmake/4.1.2/bin/cmake -GNinja -B build \
          -DRUST_BINDINGS=aarch64-linux-android \
          -DCMAKE_SYSROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/sysroot/ \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/29.0.14206865/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DANDROID_STL=c++_shared
        ninja -j$(nproc) -C build
        
    - name: Tar BoringSSL
      run: |
        tar czf boringssl.tar.gz boringssl/build boringssl/rust
        
    - name: Output BoringSSL
      uses: actions/upload-artifact@v4
      with:
        name: boringssl.tar.gz
        path: boringssl.tar.gz
        retention-days: 3

  setup-and-build:
    runs-on: ubuntu-latest
    needs:
      - build-boringssl
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        build-type: [debug, release]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android NDK
      run: |
        echo "y" | sdkmanager --install "ndk;29.0.14206865" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        
    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Download BoringSSL
      uses: actions/download-artifact@v4
      with:
        name: boringssl.tar.gz
        path: .

    - name: Configure Cargo for Android target
      run: |
        tar xf boringssl.tar.gz
        python scripts/setup_cargo_config.py \
          --force \
          --ndk-root "$ANDROID_SDK_ROOT/ndk/29.0.14206865" \
          --host-tag linux-x86_64
        cat >> .cargo/config.toml <<EOF

        [patch.crates-io]
        bssl-sys = { path = "$GITHUB_WORKSPACE/boringssl/rust/bssl-sys" }
        EOF

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install toml

    - name: Build OhMyKeymint
      id: prepareArtifact
      env:
        BORINGSSL_BUILD_DIR: ${{ github.workspace }}/boringssl/build
      run: |
        unset RUSTFLAGS
        python build.py --${{ matrix.build-type }}
        name=`ls target/OhMyKeymint-* | awk -F '(/|.zip)' '{print $2}'` && echo "releaseName=$name" >> $GITHUB_OUTPUT
        unzip target/OhMyKeymint-*.zip -d module-${{ matrix.build-type }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      id: upload
      with:
        name: ${{ steps.prepareArtifact.outputs.releaseName }}
        path: "./module-${{ matrix.build-type }}/*"
        retention-days: 90
